name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your API key**, and remove personal information from logs and screenshots.
        For security problems, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click the companion
        2. Choose ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clawd Buddy version
      description: Shown in Settings → About
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: AI mode
      options: [Offline mode, Claude enabled, Not sure]
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Monitor setup, taskbar settings, sprite pack details (no copyrighted files, please)…
