<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'"
    />
    <title>CLAWD://TERMINAL</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div id="frame">
      <header id="titlebar">
        <span class="title"><span class="blip" aria-hidden="true"></span>CLAWD://TERMINAL</span>
        <span class="controls">
          <button id="win-min" class="tb" title="Minimize" aria-label="Minimize">_</button>
          <button id="win-close" class="tb" title="Close" aria-label="Close">X</button>
        </span>
      </header>
      <div id="statusbar">
        <span id="status" class="status ready" role="status">READY</span>
        <span id="mode" class="mode"></span>
        <span class="spacer"></span>
        <button id="clear" class="link" title="Clear the conversation">CLR</button>
        <button id="open-settings" class="link" title="Settings">CFG</button>
      </div>
      <div id="notice" hidden></div>
      <main id="screen" aria-live="polite" aria-label="Conversation" tabindex="0"></main>
      <form id="composer" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <textarea id="input" rows="1" spellcheck="false" placeholder="type here · /help" aria-label="Message to Clawd"></textarea>
        <button id="send" type="submit">SEND</button>
      </form>
    </div>
    <script src="main.js"></script>
  </body>
</html>
